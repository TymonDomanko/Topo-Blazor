name: Deploy everything (live test build)

# Every push to the everything-live branch builds the tests, publishes the site and puts it at https://<owner>.github.io/Topo-Blazor/ (the
# gh-pages branch of this fork). It is the combined build of the open pull requests, for trying them against a real Terrain login.
# Changes to Terrain are held back unless they are allowed in Settings (Model/TestBuild), except years of service, which has its own switch.
# A banner says it is a test build.
#
# Repository settings it reads:
#   secrets.SYNCFUSION_KEY   the Syncfusion key the site is built with (without it the site shows Syncfusion's trial banner)
#   vars.REPORT_URL          the Function URL of your own copy of the report function (with the trailing /). Without it the report downloads
#                            (pdf and xlsx) go to the live report function, which does not know the newer reports (they come back blank).
on:
  push:
    branches: [ everything-live ]
  workflow_dispatch:

permissions:
  contents: write   # push the built site to gh-pages

# Only one deploy writes to gh-pages at a time; a newer push waits behind the running one
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SYNCFUSION_KEY: ${{ secrets.SYNCFUSION_KEY }}
      REPORT_URL: ${{ vars.REPORT_URL }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Nothing goes live if a test fails
    - name: Run unit tests
      run: dotnet test ./TopoReportFunctionTestUnix --nologo

    - name: Replace Syncfusion key
      if: ${{ env.SYNCFUSION_KEY != '' }}
      run: sed -i "s@__SYNCFUSION-KEY__@$SYNCFUSION_KEY@g" ./Topo/Program.cs

    # The site sends its reports to the address written in ReportService.cs; point it at your own report function instead of the live one
    - name: Point the site at your report function
      if: ${{ env.REPORT_URL != '' }}
      run: sed -i -E "s@https://[a-z0-9]+\.lambda-url\.ap-southeast-2\.on\.aws/@$REPORT_URL@g" ./Topo/Services/ReportService.cs

    - name: Publish the site
      run: dotnet publish ./Topo/Topo.csproj -c Release -o release --nologo

    # The site lives in the Topo-Blazor folder of the project site; the banner says what this is
    - name: Set the base path, title and the banner
      run: |
        INDEX=release/wwwroot/index.html
        sed -i 's@<base href="/" />@<base href="/Topo-Blazor/" />@' $INDEX
        sed -i 's@<title>Topo</title>@<title>Topo EVERYTHING</title>@' $INDEX
        BANNER="<div style=\"position:fixed;bottom:0;right:0;z-index:99999;background:#c0392b;color:#fff;padding:2px 10px;font:12px sans-serif;border-top-left-radius:6px;opacity:.9\">EVERYTHING - ${GITHUB_SHA::7} - test build, Terrain changes off unless allowed in Settings (years of service has its own switch)</div>"
        sed -i "s@</body>@$BANNER</body>@" $INDEX
        grep -q 'Topo-Blazor/' $INDEX && grep -q 'EVERYTHING - ' $INDEX
        cp $INDEX release/wwwroot/404.html
        touch release/wwwroot/.nojekyll

    - name: Publish to gh-pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: release/wwwroot
        clean: true
